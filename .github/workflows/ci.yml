name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            os: ubuntu-latest
          - python: '3.13'
            os: ubuntu-latest
          - python: '3.12'
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # PySide6 links libEGL and libGL at import time. The GitHub runner image
      # does not ship them, so without this the whole tests/ui package is
      # skipped and the interface is never exercised in CI. The packages exist
      # on both ubuntu-latest and ubuntu-22.04.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v

  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # Post-defense: ruff format --check over the whole tree and mypy . The
      # formatting and typing findings are in modules outside this change and
      # are deferred; see docs/AUDIT.md.
      # - run: ruff format --check .
      # - run: mypy .

  audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Audits the pinned runtime and development dependencies against
      # published advisories. A new advisory fails the job so it is reviewed
      # rather than missed.
      - run: pip-audit
