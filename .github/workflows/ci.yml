name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            os: ubuntu-latest
          - python: '3.13'
            os: ubuntu-latest
          - python: '3.12'
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,web]"
      # PySide6 links libEGL and libGL at import time. The GitHub runner image
      # does not ship them, so without this the whole tests/ui package is
      # skipped and the interface is never exercised in CI. The packages exist
      # on both ubuntu-latest and ubuntu-22.04.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v

  ui-tests:
    # The interface is exercised on its own matrix because it is the layer most
    # sensitive to the runner: the Qt platform, the desktop locale and the
    # window manager. Both runner images and both supported interpreters are
    # covered, always offscreen so no display is required.
    name: ui (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Run interface tests
        env:
          QT_QPA_PLATFORM: offscreen
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: >
          pytest tests/ui -q
          --cov=src.ui --cov-report=term-missing --cov-report=xml:coverage-ui.xml
      - name: Upload interface coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui-${{ matrix.python }}-${{ matrix.os }}
          path: coverage-ui.xml
          if-no-files-found: ignore
      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diff-${{ matrix.python }}-${{ matrix.os }}
          path: .snapshot-actual/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Comment the snapshot difference
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = '.snapshot-actual';
            let files = [];
            try { files = fs.readdirSync(dir); } catch (e) { files = []; }
            if (files.length === 0) return;
            const body = [
              'Interface snapshot baselines differ on this run.',
              '',
              'Changed images:',
              ...files.filter(f => f.startsWith('diff_')).map(f => '- `' + f + '`'),
              '',
              'Download the `snapshot-diff-*` artefact to inspect them. Set',
              '`MADRIGAL_UPDATE_SNAPSHOTS=1` locally to rewrite a baseline on purpose.',
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,web]"
      - run: ruff check .
      # Post-defense: ruff format --check over the whole tree and mypy . The
      # formatting and typing findings are in modules outside this change and
      # are deferred; see docs/AUDIT.md.
      # - run: ruff format --check .
      # - run: mypy .

  audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Audits the pinned runtime and development dependencies against
      # published advisories. A new advisory fails the job so it is reviewed
      # rather than missed.
      - run: pip-audit
