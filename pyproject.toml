[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madrigal-protocol-lab"
version = "0.1.0"
description = "Local desktop laboratory for investigating undocumented binary protocols over TCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sabadash Pavel" }]
dependencies = [
    "PySide6==6.8.1",
    "dpkt==1.9.8",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "jsonschema==4.23.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest-cov==7.1.0",
    "pip-audit==2.10.1",
]

[tool.setuptools]
packages = [
    "src",
    "src.capture",
    "src.protocol",
    "src.hypothesis",
    "src.ui",
    "src.project",
    "src.report",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "ISC", "RUF", "BLE"]
ignore = [
    "B008",
    "E501",
    # A ``str`` enum is kept as ``str, Enum`` so its members remain plain strings
    # for the public API; rewriting to ``StrEnum`` would change that contract.
    "UP042",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
