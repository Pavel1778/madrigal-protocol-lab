[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madrigal-protocol-lab"
version = "1.1.0"
description = "Local desktop laboratory for investigating undocumented binary protocols over TCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sabadash Pavel" }]
dependencies = [
    "PySide6==6.8.1",
    "dpkt==1.9.8",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
# The optional local web interface. Kept out of the base install so a desktop
# user does not pull the server stack. Install with: pip install -e ".[web]"
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest==9.0.3",
    "jsonschema==4.23.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest-cov==7.1.0",
    "pip-audit==2.10.1",
    "httpx>=0.27",
    # Only the snapshot tests use it, and only to draw the difference image that
    # CI uploads when a baseline changes. The comparison itself does not need it.
    "Pillow>=10.4",
    # The deck build embeds the brand fonts with fontTools, and the guard test
    # that checks the embedded faces imports it too.
    "fonttools>=4.60",
]

[project.gui-scripts]
madrigal-lab = "src.ui.main_window:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.web" = ["templates/*.html", "static/*.js", "static/*.css", "static/*.png"]
"src.ui.locale" = ["*.qm", "*.ts"]
"src.ui.samples" = ["*.json", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Extended ruleset: correctness (E/F), import order (I), modernisation (UP),
# likely bugs (B), simplification (SIM/C4), implicit concatenation (ISC), and
# the ruff-specific checks (RUF).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "ISC", "RUF"]
# E501 stays off: the project keeps a hand-wrapped 88-column style, and line
# length is not enforced as a hard limit. RUF001 is off because the Russian
# text legitimately contains typographic characters that look like ASCII.
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
