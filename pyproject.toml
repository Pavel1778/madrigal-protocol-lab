[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madrigal-protocol-lab"
version = "0.1.0"
description = "Local desktop laboratory for investigating undocumented binary protocols over TCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sabadash Pavel" }]
dependencies = [
    "PySide6==6.8.1",
    "dpkt==1.9.8",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
# The optional local web interface. Kept out of the base install so a desktop
# user does not pull the server stack. Install with: pip install -e ".[web]"
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest==9.0.3",
    "jsonschema==4.23.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest-cov==7.1.0",
    "pip-audit==2.10.1",
    "httpx>=0.27",
]

[project.gui-scripts]
madrigal-lab = "src.ui.main_window:main"

[tool.setuptools]
packages = [
    "src",
    "src.capture",
    "src.protocol",
    "src.hypothesis",
    "src.ui",
    "src.project",
    "src.report",
    "src.web",
]

[tool.setuptools.package-data]
"src.web" = ["templates/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Starter ruleset: only the rules that catch real mistakes are enabled while the
# deadline is close. The extended set (isort, bugbear, pyupgrade, simplify,
# comprehensions, ISC, RUF, BLE) is tracked in docs/AUDIT.md and will be turned
# on after the defense.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
